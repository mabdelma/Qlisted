name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qcart
          POSTGRES_PASSWORD: qcart
          POSTGRES_DB: qcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qcart -d qcart"
          --health-interval 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Must name the project explicitly. Bare `npx tsc --noEmit` resolves to
      # ./tsconfig.json, which is solution-style — `"files": []` plus references
      # — and `-p` does NOT follow references (only `--build` does, and these
      # projects aren't `composite`, so it can't). It therefore type-checked
      # exactly ZERO files, and since `vite build` strips types rather than
      # checking them, nothing in CI was type-checking the frontend at all.
      # tsconfig.node.json is deliberately not included: it fails on a syntax
      # error inside @vitejs/plugin-react's own .d.ts (skipLibCheck does not
      # suppress parse errors), which is a dependency-version problem, not ours.
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  server:
    name: Server
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qcart
          POSTGRES_PASSWORD: qcart
          POSTGRES_DB: qcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qcart -d qcart"
          --health-interval 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npx tsc --noEmit
      - run: cd server && npm test
        env:
          DATABASE_URL: postgresql://qcart:qcart@localhost:5432/qcart
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server/dist/
          retention-days: 1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [frontend, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qcart
          POSTGRES_PASSWORD: qcart
          POSTGRES_DB: qcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qcart -d qcart"
          --health-interval 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cd server && npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build server
        run: cd server && npx tsc
      - name: Run migrations & seed
        run: |
          cd server
          npx drizzle-kit migrate --config=drizzle.config.ts
          npm run seed
        env:
          DATABASE_URL: postgresql://qcart:qcart@localhost:5432/qcart
          REDIS_URL: redis://localhost:6379
          # Pin the hotel room service token so the in-room specs can address it
          # by a stable URL. `npm run seed` runs server/seed.ts — NOT
          # server/src/db/seed.ts, which nothing executes.
          # There is no table equivalent: the specs address table 1 as
          # /r/demo-cafe/table/table-1, so its token stays predictable.
          SEED_ROOM_TOKEN: e2e-room-token-fixed
      - name: Start API server
        run: |
          cd server && node dist/index.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health >/dev/null || { echo "::error::API never became healthy"; exit 1; }
        env:
          DATABASE_URL: postgresql://qcart:qcart@localhost:5432/qcart
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          PORT: 3001
          CORS_ORIGIN: http://localhost:4173
          # The whole suite hits the API from one IP; at production limits the
          # later specs collect 429s that look like product failures.
          RATE_LIMIT_FACTOR: "100"
      # `vite preview` serves dist/, which this job never produced — the frontend
      # job already built it, so reuse that artifact instead of rebuilding.
      # Without this the preview served nothing and every page-level test failed.
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist
      - name: Start Vite preview
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || { echo "::error::vite preview never served dist/"; exit 1; }
      - name: Run Playwright
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          E2E_BASE_URL: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 3
      # The API runs in the background, so anything it logs after its own step
      # finishes is lost. Capture it so a 500 can be traced to a stack.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-log
          path: api.log
          retention-days: 3

  # Seven of the nine containers in production are these microservices, and
  # until this job existed CI covered none of them: `vitest.config.ts` includes
  # only `src/**`, and the root tsconfig doesn't reach `microservices/`. They
  # were lint-only, while serving the entire order/payment/auth path.
  #
  # Worth knowing why the per-workspace tsconfig.json files exist: these
  # packages had `typecheck: tsc --noEmit` with no tsconfig of their own, so tsc
  # walked up to the repo-root tsconfig.json — which is solution-style
  # (`"files": []` + references) and checks ZERO files. Every one of those
  # scripts silently passed without reading a line of code.
  microservices:
    name: Microservices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: microservices/package-lock.json
      - run: cd microservices && npm ci
      # Both scripts are `--workspaces --if-present`, so a new service is
      # covered the moment it has the script — no edit here required.
      - run: cd microservices && npm run typecheck
      - run: cd microservices && npm test
      # Loads each service exactly as its Dockerfile builds it: one esbuild CJS
      # bundle, no node_modules. Unit tests run from TS source WITH
      # node_modules, so they structurally cannot catch a bundle-only failure —
      # and two such failures were killing services on startup in production.
      - run: cd microservices && npm run smoke:bundle

  # The Expo app had NO typecheck anywhere and its node_modules were never even
  # installed in CI, so three real bugs sat in it unnoticed: a Tab.Screen with
  # no component (React Navigation throws for that at runtime), a screen missing
  # from TabParamList, and a call to a setter that does not exist — which threw
  # a ReferenceError inside an empty catch, so enabling push notifications
  # silently did nothing. Typechecking is what found all three.
  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: cd mobile && npm ci
      - run: cd mobile && npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/
      - name: Start preview server
        run: |
          npx vite preview --port 4173 &
          sleep 3
      - name: Run Lighthouse CI
        run: |
          npx lhci autorun --upload.target=temporary-public-storage || echo "Lighthouse audit completed"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}
        continue-on-error: true
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
