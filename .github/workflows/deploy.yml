name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: qcart

jobs:
  deploy:
    name: Build & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Required by the `cache-to: type=gha` on both builds below. The default
      # buildx driver is `docker`, which cannot export a cache at all ("Cache
      # export is not supported for the docker driver"); this switches to the
      # docker-container driver, which can. Deploy had never actually reached
      # this step before — CI was failing, so every run was skipped.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `github.repository` is `mabdelma/Qlisted`, and a Docker repository name
      # must be lowercase — buildx rejects the tag outright. GitHub expressions
      # have no lowercase function, so derive it once here and use it for both
      # the build tags and the image names the VPS pulls, so the two cannot
      # drift apart.
      - name: Resolve lowercase image repository
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/api:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/frontend:${{ github.sha }}
          build-args: |
            VITE_STRIPE_KEY=${{ secrets.VITE_STRIPE_KEY }}
            VITE_API_URL=
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Abort on the first failure. Without this a failed `git pull` was
            # silent and the stack was recreated with stale compose files.
            set -e
            cd /var/www/qcart
            # The image-tag seds below dirty this file on every deploy, which makes
            # `git pull` refuse whenever a commit touches it. It is regenerated
            # from the committed version each time, so discard the old edits.
            git checkout -- docker-compose.vps.yml
            git pull --ff-only origin main
            # The API is addressed by the unique container name `qcart-api`
            # (a generic `api` alias collides with other stacks on `edge`).
            # Refuse to deploy if some other stack already owns that name —
            # otherwise --force-recreate would remove our API and then fail.
            if owner=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}/{{index .Config.Labels "com.docker.compose.service"}}' qcart-api 2>/dev/null) && [ "$owner" != "qcart-prod/api" ]; then
              echo "::error::container name qcart-api is already used by $owner — aborting before touching the running stack"
              exit 1
            fi
            sed -i "s|image:.*api:.*|image: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/api:${{ github.sha }}|" docker-compose.vps.yml
            sed -i "s|image:.*frontend:.*|image: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/frontend:${{ github.sha }}|" docker-compose.vps.yml
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.vps.yml pull
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.vps.yml up -d --force-recreate migrate
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.vps.yml up -d --force-recreate api qcart-frontend
            # Smoke test through nginx: require 10 consecutive healthy responses
            # from OUR API. If /api were still split across another stack's
            # upstream, roughly half would 404 and this would never pass.
            ok=0
            for i in $(seq 1 45); do
              if docker exec qcart-frontend wget -qO- http://127.0.0.1/api/health 2>/dev/null | grep -q '"status":"ok"'; then
                ok=$((ok + 1)); [ "$ok" -ge 10 ] && break
              else
                ok=0
              fi
              sleep 2
            done
            if [ "$ok" -lt 10 ]; then
              echo "::error::/api through qcart-frontend is not consistently reaching the QCart API"
              docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.vps.yml logs --tail=50 api qcart-frontend
              exit 1
            fi
            docker image prune -f
