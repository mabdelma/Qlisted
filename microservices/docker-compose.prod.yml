# ─── Production overlay for the Qlisted services ─────────────────────────────
# Runs the gateway + services on the VPS ALONGSIDE the monolith. They join the
# monolith's network (qcart-prod_default) to reach Postgres + the monolith API,
# and the shared `edge` network so Caddy can route to the gateway.
#
# CUTOVER HAS HAPPENED — treat this stack as production. Caddy's qlisted.com
# block routes the revenue path here, not to the monolith: POST
# /api/r/:slug/orders, PATCH .../orders/:id/status, POST
# .../payments/create-intent, POST /api/webhooks/stripe, POST /api/auth/{login,
# register,forgot-password,reset-password,refresh,verify-email}, GET
# /api/r/:slug/{menu,campaigns}, and subscription checkout/cancel. Only what
# matches none of those falls through to qcart-frontend -> qcart-api.
#
# The previous version of this comment said nothing here was in the live
# request path. It stayed long after that stopped being true, and is a large
# part of why the monolith kept being mistaken for production.
#
# Images are pulled from the registry and pinned per commit by the Deploy
# workflow, which exports QLISTED_TAG=<sha>. `latest` is a local convenience
# default only — a deploy always pins.
#
#   docker compose -f docker-compose.services.yml -f docker-compose.prod.yml \
#     --env-file .env up -d --build
#
# .env must provide AUTH_SECRET (= monolith JWT_SECRET) and DATABASE_URL.
name: qlisted-services

networks:
  qcart-prod_default:
    external: true

services:
  gateway:
    image: "ghcr.io/mabdelma/qlisted/gateway:${QLISTED_TAG:-latest}"
    environment:
      MONOLITH_URL: "http://qcart-api:3001"
    networks: [qlisted-svc, edge, qcart-prod_default]

  catalog:
    image: "ghcr.io/mabdelma/qlisted/catalog:${QLISTED_TAG:-latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env}"
    networks: [qlisted-svc, qcart-prod_default]

  auth:
    image: "ghcr.io/mabdelma/qlisted/auth:${QLISTED_TAG:-latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      NOTIFICATIONS_URL: "${NOTIFICATIONS_URL:-http://qlisted-notifications:8080}"
      FRONTEND_URL: "${FRONTEND_URL:-https://qlisted.com}"
    networks: [qlisted-svc, qcart-prod_default]

  orders:
    image: "ghcr.io/mabdelma/qlisted/orders:${QLISTED_TAG:-latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@qlisted.com}"
      # The Language Bridge. Without these the orders service still runs and
      # still takes orders — translationEnabled() just returns false and the
      # bridge silently no-ops, which is exactly what happened: the first real
      # order stored "sin cebolla, por favor" with notes_translated empty.
      #
      # Same names the monolith uses, so one .env entry serves both.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_TRANSLATE_MODEL: "${OPENAI_TRANSLATE_MODEL:-}"
      TRANSLATE_TIMEOUT_MS: "${TRANSLATE_TIMEOUT_MS:-}"
    networks: [qlisted-svc, qcart-prod_default]

  billing:
    image: "ghcr.io/mabdelma/qlisted/billing:${QLISTED_TAG:-latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_STARTER: "${STRIPE_PRICE_STARTER:-}"
      STRIPE_PRICE_GROWTH: "${STRIPE_PRICE_GROWTH:-}"
      STRIPE_PRICE_ENTERPRISE: "${STRIPE_PRICE_ENTERPRISE:-}"
      FRONTEND_URL: "${FRONTEND_URL:-https://qlisted.com}"
      NOTIFICATIONS_URL: "${NOTIFICATIONS_URL:-http://qlisted-notifications:8080}"
    networks: [qlisted-svc, qcart-prod_default]

  engagement:
    image: "ghcr.io/mabdelma/qlisted/engagement:${QLISTED_TAG:-latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
    networks: [qlisted-svc, qcart-prod_default]

  notifications:
    image: "ghcr.io/mabdelma/qlisted/notifications:${QLISTED_TAG:-latest}"
    environment:
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@qlisted.com}"
    networks: [qlisted-svc, qcart-prod_default, edge]
