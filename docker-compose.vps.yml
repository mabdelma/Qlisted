# ─── QCart VPS overlay — shared-Caddy, multi-app VPS ─────────────────────────
# QCart shares one Linux VPS with qarrito and escoutly. qarrito's stack owns the
# single Caddy reverse proxy (ports 80/443, automatic Let's Encrypt). Every other
# app — including QCart — joins the shared external `edge` Docker network and is
# reached by Caddy through its container name. No app but Caddy publishes :80/:443.
#
# Layered on top of the base docker-compose.yml:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
# Prereqs on the VPS (one-time):
#   docker network create edge        # if qarrito/escoutly haven't already
#   cp .env.prod.example .env.prod     # then fill in real secrets
#
# DNS: one A record  →  qlisted.com → VPS public IP
# Then add the QCart block to qarrito's Caddyfile (see DEPLOYMENT.md) and reload:
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
# ─────────────────────────────────────────────────────────────────────────────
name: qcart-prod

services:
  postgres:
    restart: always
    # Caps so a spike in one app can't OOM the shared multi-app host.
    mem_limit: 1g
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-qcart}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"
      POSTGRES_DB: "${POSTGRES_DB:-qcart}"
    # !reset replaces the base port list instead of merging — without it the
    # base file's "5434:5432" leaks through and exposes Postgres to the internet.
    ports: !reset []
    networks: [default]

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 256m
    # Same reason as postgres above, and this one was missed: without !reset the
    # base file's "6379:6379" merges in and binds 0.0.0.0, publishing an
    # unauthenticated Redis holding session and rate-limit state straight to the
    # internet. It was the only datastore on this host bound to 0.0.0.0 — every
    # other app's was already internal-only.
    #
    # A ufw rule is not a substitute: Docker writes its own DNAT rules and
    # bypasses it. Removing the publish is the fix.
    ports: !reset []
    networks: [default]

  uploads-init:
    image: alpine:3
    # Explicitly root: the whole job is to hand the volume to the unprivileged
    # user the API actually runs as.
    user: "0:0"
    volumes:
      - qcart_uploads:/data
    # uid/gid come from server/Dockerfile's `adduser -S appuser -G appgroup`.
    command: ["sh", "-c", "chown -R 100:101 /data && chmod 775 /data"]
    restart: "no"
    networks: [default]

  migrate:
    image: ghcr.io/mabdelma/qlisted/api:latest
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-qcart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qcart}"
      # Seed creates the platform super_admin (idempotent) with these on first run.
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL in .env.prod}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in .env.prod}"
    networks: [default]

  api:
    image: ghcr.io/mabdelma/qlisted/api:latest
    depends_on:
      redis:
        condition: service_started
      uploads-init:
        condition: service_completed_successfully
    restart: always
    mem_limit: 1g
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-qcart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qcart}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env.prod}"
      PORT: 3001
      CORS_ORIGIN: "https://${DOMAIN:-qlisted.com}"
      REDIS_URL: "redis://redis:6379"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Off (default) = all guest payments settle to this shared Stripe account.
      # Set to "true" to route each linked tenant's payments to their own account.
      STRIPE_CONNECT_ENABLED: "${STRIPE_CONNECT_ENABLED:-}"
      STRIPE_PRICE_STARTER: "${STRIPE_PRICE_STARTER:-}"
      STRIPE_PRICE_GROWTH: "${STRIPE_PRICE_GROWTH:-}"
      STRIPE_PRICE_ENTERPRISE: "${STRIPE_PRICE_ENTERPRISE:-}"
      FRONTEND_URL: "https://${DOMAIN:-qlisted.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Point at a local/self-hosted OpenAI-compatible LLM (Ollama, llama.cpp, vLLM,
      # LM Studio) to keep AI on-prem — no API key needed, no data leaves the box.
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-}"
      NOTIFICATIONS_URL: "${NOTIFICATIONS_URL:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Twilio SMS (booking confirmations). Leave blank to disable — sendSms logs instead.
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      NODE_ENV: production
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      # Mailbox management via the shared mailcow (reached over `edge`).
      MAILCOW_API_KEY: "${MAILCOW_API_KEY:-}"
      MAILCOW_API_HOST: "${MAILCOW_API_HOST:-mailcowdockerized-nginx-mailcow-1}"
      MAILCOW_API_VHOST: "${MAILCOW_API_VHOST:-mail.entrequipos.com}"
      MAILCOW_MAIL_DOMAIN: "${MAILCOW_MAIL_DOMAIN:-qlisted.com}"
    ports: !reset []
    volumes:
      # Uploaded menu images/logos live on the API container's filesystem
      # (/app/uploads). Persist them across redeploys.
      - qcart_uploads:/app/uploads
    networks: [default, edge]

  qcart-frontend:
    image: ghcr.io/mabdelma/qlisted/frontend:latest
    # Caddy proxies this by name over `edge`. The service name doubles as the
    # edge DNS alias, so it MUST be unique across all stacks on the VPS — a
    # generic "frontend" alias collides with qarrito's upstream and 502s it.
    container_name: qcart-frontend
    restart: always
    mem_limit: 256m
    ports: !reset []
    networks: [default, edge]

volumes:
  qcart_uploads:

networks:
  # Shared cross-stack network; Caddy (in qarrito's stack) joins it and proxies
  # qlisted.com → qcart-frontend:80. Created once on the host:
  #   docker network create edge
  edge:
    external: true
